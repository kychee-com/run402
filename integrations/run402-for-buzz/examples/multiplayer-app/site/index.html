<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small customer-feedback board deployed by a Buzz agent through run402.">
    <title>Beta feedback</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Beta group</p>
        <h1>What should we improve next?</h1>
        <p>Share an idea, vote on priorities, or add context in a comment.</p>
      </header>
      <section class="composer" aria-labelledby="new-title">
        <h2 id="new-title">Add feedback</h2>
        <form id="feedback-form">
          <label>Title <input name="title" minlength="3" maxlength="120" required></label>
          <label>Details <textarea name="body" maxlength="2000" required></textarea></label>
          <label>Attachment URL <input name="attachment_url" type="url" placeholder="https://…"></label>
          <button type="submit">Publish feedback</button>
          <output id="form-status" aria-live="polite"></output>
        </form>
      </section>
      <section aria-labelledby="board-title">
        <div class="row"><h2 id="board-title">Feedback board</h2><button id="refresh" class="quiet">Refresh</button></div>
        <div id="board" aria-live="polite"></div>
      </section>
    </main>
    <template id="card-template">
      <article class="card">
        <div class="row"><span class="status"></span><time></time></div>
        <h3></h3><p class="body"></p><a class="attachment" rel="noreferrer">Attachment</a>
        <div class="actions">
          <button class="vote">▲ <span></span></button>
          <form class="admin-form" aria-label="Admin status action">
            <select name="status" aria-label="Feedback status">
              <option value="open">Open</option>
              <option value="planned">Planned</option>
              <option value="shipped">Shipped</option>
              <option value="closed">Closed</option>
            </select>
            <button class="quiet">Set status</button>
          </form>
        </div>
        <div class="comments"></div>
        <form class="comment-form"><input name="body" maxlength="1000" placeholder="Add context…" required><button>Comment</button></form>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>

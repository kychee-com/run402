name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # gitvault-persistent-helper task 3.2: the resident engine's Windows
  # named-pipe transport, exercised on a real Windows runner — the daemon
  # suite covers lifecycle, equivalence, fallback, and the thin-path gate.
  daemon-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      # The build script is unix-shell (rm -rf / cp -R); npm on Windows runs
      # scripts under cmd. Git Bash ships on the runner — use it.
      - run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
      - run: npm run build
      - run: node --test cli-gitvault-daemon.test.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Production-dependency audit: fails only on a high/critical advisory with a
      # non-major fix available (see scripts/audit-gate.mjs for the policy).
      - run: node scripts/audit-gate.mjs
      - run: npm run build
      - run: npm run test:skill
      - run: npm run test:sync
      # Single-source gate: the committed flat agent files (llms-*.txt) must
      # match what docs-site/src/content regenerates. Pure Node — no docs-site
      # install needed. Fails the PR if content was edited without regenerating.
      - run: node scripts/build-agent-flat-docs.mjs --check
      # Single-source gate: the committed cli/gitvault-surface.json (verbs,
      # retired spellings, capability ledger) must match what
      # command-manifest.mjs + gitvault-capabilities.mjs regenerate — the
      # file run402-private's page-truth gate resolves against the
      # published package (openspec/changes/gitvault-page-truth-gate).
      - run: node scripts/build-gitvault-surface.mjs --check
      # Quote the globs so Node handles expansion natively. Node's --test
      # glob matching recurses into nested dirs AND matches depth-0 files,
      # so it works regardless of the shell's globstar support. (Earlier
      # we relied on `shopt -s globstar`, which silently dropped sdk/src
      # tests because they weren't listed and dropped depth-0 files on
      # systems where globstar isn't enabled.)
      # The gitvault conformance vectors are VENDORED at test-vectors/r402s-v0
      # and asserted against CONTINUITY.json on load, so this job replays them
      # for real. Before task 5.6b the suites resolved a developer-machine
      # absolute path, silently skipped ~130 vectors, and still reported green
      # — so the replay is asserted explicitly here rather than left to be
      # inferred from a passing run. `GITVAULT_VECTORS_OPTOUT` must never be set
      # in CI; the check below fails the job if it is.
      - name: gitvault vectors are replayed, not skipped
        run: |
          if [ -n "${GITVAULT_VECTORS_OPTOUT:-}" ]; then
            echo "GITVAULT_VECTORS_OPTOUT is set in CI — the vector suites would skip. Refusing." >&2
            exit 1
          fi
          node scripts/check-gitvault-vectors.mjs
      - run: node --experimental-test-module-mocks --test --import tsx 'src/**/*.test.ts' 'core/src/**/*.test.ts' 'sdk/src/**/*.test.ts'
      - run: npm run test:e2e
      - run: npm run test:integration
      # Type-check every TypeScript fenced block in sdk/README.md,
      # sdk/llms-sdk.txt, and the top-level README.md against the
      # published @run402/sdk and @run402/sdk/node types. Fails the PR if
      # any example references a method or field that does not exist on
      # the actual exports.
      - run: npm run test:docs

  # The human docs portal (Astro Starlight, static) must compile, and the deploy
  # manifest generator must produce a valid manifest from the build output.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build docs portal
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      - name: Build deploy manifest from dist
        run: node scripts/build-docs-deploy-manifest.mjs
      - name: Agent flat docs are regenerated from portal content (single source)
        run: node scripts/build-agent-flat-docs.mjs --check

  # @run402/astro has an independent release cadence, but it still lives in
  # this monorepo and imports workspace SDK types. Keep its publish-time gates
  # on ordinary PRs too so Astro regressions are caught before release day.
  astro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Build @run402/sdk + core
        run: |
          npm run build:core
          npm run build:sdk
      - name: Type-check @run402/astro
        run: npx tsc --noEmit -p astro
      - name: Test @run402/astro
        run: npm test --workspace=astro
      - name: Build @run402/astro
        run: npm run build --workspace=astro

  # `kygit` is the KyGit brand door over `run402 repos` (openspec:
  # kygit-cli-shim, kychee-com/run402-private) — no build step; its verb
  # table is derived at runtime from the workspace-sibling run402's own
  # gitvault-surface.json, so these tests also assert that resolution.
  kygit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Test kygit
        run: npm test --workspace=kygit

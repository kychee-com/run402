name: r402s-verify

# The independent-lineage vault verifier (Rust). Lives outside the npm
# workspaces and outside publish.yml; see r402s-verify/README.md for release.
#
# It watches test-vectors/** as well as its own tree: the replay exists to
# disagree with the vendored set, so a vector-only refresh is exactly the change
# it must not sit out. Filtering on r402s-verify/** alone let the frozen set move
# without the one job that proves an independent implementation still agrees.
on:
  push:
    branches: [main]
    paths:
      - "r402s-verify/**"
      - "test-vectors/**"
      - ".github/workflows/r402s-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "r402s-verify/**"
      - "test-vectors/**"
      - ".github/workflows/r402s-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r402s-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit on the action's master branch (its v1 tag), which
      # takes the toolchain as an input; `@stable` was a movable branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: r402s-verify
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The task-1.2 vector set is private; tests/vectors.rs skips loudly when it
      # The frozen set is VENDORED at test-vectors/r402s-v0/ (vectors + schemas,
      # integrity-pinned by CONTINUITY.json), so the replay is a real gate here;
      # R402S_VECTORS/R402S_SCHEMAS only override the location.
      - run: cargo test --locked
      - run: bash scripts/never-assembled-gate.sh
